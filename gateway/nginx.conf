# Public entry point. It never changes during a deploy except for the generated
# upstream file, which says which colour (blue/green) is live.
# active.conf defines: upstream api_active { ... }  upstream web_active { ... }
include /etc/nginx/upstream.d/active.conf;

server {
  listen 8080;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://api_active;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 2s;
  }

  location / {
    proxy_pass http://web_active;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
