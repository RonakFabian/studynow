name: monitor

# Scheduled health check from OUTSIDE the VM (so it still alerts when the whole VM is down).
# Needs: repository variable HEALTH_URL (e.g. http://<vm-ip>/api/health) and repository secret DISCORD_WEBHOOK_URL.
on:
  schedule:
    - cron: "2-57/5 * * * *"     # every 5 min at :02 :07 :12 ... (off the busy :00/:05 marks, which GitHub delays or drops)
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Pretend the check failed (to test the Discord alert)"
        type: boolean
        default: false
      simulate_stale_backup:
        description: "Pretend no recent backup exists (to test the Discord alert)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  health:
    name: health check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check /api/health
        id: check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
          SIMULATE: ${{ inputs.simulate_failure }}
        run: |
          set -u
          if [ "$SIMULATE" = "true" ]; then
            echo "reason=simulated failure (manual test)" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if [ -z "$HEALTH_URL" ]; then
            echo "reason=HEALTH_URL variable is not set" >> "$GITHUB_OUTPUT"; exit 1
          fi
          # 3 attempts so one dropped packet does not page anyone
          if ! body="$(curl -fsS -m 10 --retry 2 --retry-delay 5 --retry-all-errors "$HEALTH_URL" 2>&1)"; then
            echo "reason=request failed: ${body:0:200}" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "$body"
          if ! echo "$body" | grep -q '"db":true'; then
            echo "reason=unhealthy response: ${body:0:200}" >> "$GITHUB_OUTPUT"; exit 1
          fi
      - name: Alert Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REASON: ${{ steps.check.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL secret is not set"; exit 1; }
          msg="$(printf ':rotating_light: **StudyUK health check FAILED**\n%s\nRun: %s' "${REASON:-unknown}" "$RUN_URL")"
          jq -n --arg c "$msg" '{content: $c}' | curl -fsS -m 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK"

  backup:
    name: backup freshness (bucket)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # RPO is 1 h: backups are hourly, so no file newer than 90 min means a run was missed or the upload failed.
    steps:
      - name: Newest backup in the bucket
        id: check
        env:
          SIMULATE: ${{ inputs.simulate_stale_backup }}
          BUCKET: ${{ vars.B2_BUCKET_NAME }}
          RCLONE_CONFIG_B2_TYPE: b2
          RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_MONITOR_KEY_ID }}
          RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_MONITOR_APP_KEY }}
        run: |
          set -u
          if [ "$SIMULATE" = "true" ]; then
            echo "reason=simulated stale backup (manual test)" >> "$GITHUB_OUTPUT"; exit 1
          fi
          if [ -z "$BUCKET" ] || [ -z "$RCLONE_CONFIG_B2_ACCOUNT" ]; then
            echo "reason=B2_BUCKET_NAME variable or B2_MONITOR_* secrets are not set" >> "$GITHUB_OUTPUT"; exit 1
          fi
          sudo apt-get install -y -qq rclone > /dev/null
          if ! list="$(rclone lsf "b2:$BUCKET" --files-only --max-age 90m 2>&1)"; then
            echo "reason=could not list the bucket: ${list:0:200}" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "backups newer than 90 min:"; echo "$list"
          if ! echo "$list" | grep -qE '^studyuk-.*\.age$'; then
            echo "reason=no backup in the bucket newer than 90 minutes (hourly backups expected)" >> "$GITHUB_OUTPUT"; exit 1
          fi
      - name: Alert Discord
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REASON: ${{ steps.check.outputs.reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL secret is not set"; exit 1; }
          msg="$(printf ':warning: **StudyUK backup check FAILED**\n%s\nRun: %s' "${REASON:-unknown}" "$RUN_URL")"
          jq -n --arg c "$msg" '{content: $c}' | curl -fsS -m 15 -H 'Content-Type: application/json' -d @- "$WEBHOOK"
